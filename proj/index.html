<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1, user-scalable=no — 버튼이 촘촘한 모바일 화면에서 더블탭이 브라우저 확대를
         유발하고, 그 확대 상태에서 손가락이 움직이면 화면이 좌우로 흔들리는 것처럼 보인다.
         내부 운영 대시보드라 핀치줌 접근성보다 안정된 앱 느낌을 우선한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#D70011" />
    <title>매장 안전사고 현황 및 알람서비스 · ㈜아성다이소 안전보건팀</title>
    <meta name="description" content="㈜아성다이소 매장 안전사고 현황 모니터링 및 AI 맞춤형 예방 알람 서비스." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Open Graph (Facebook, KakaoTalk, Slack, etc) -->
    <!-- og:image / og:url 은 절대 URL 필수 (카카오톡 등 크롤러가 상대경로 미인식) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://daiso-safety-v1-frontend.s3-website.ap-northeast-2.amazonaws.com/" />
    <meta property="og:title" content="매장 안전사고 현황 및 알람서비스" />
    <meta property="og:description" content="㈜아성다이소 · 안전보건팀 · 매장 안전사고 현황 및 AI 맞춤형 예방 알람 서비스" />
    <meta property="og:image" content="https://daiso-safety-v1-frontend.s3.ap-northeast-2.amazonaws.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://daiso-safety-v1-frontend.s3.ap-northeast-2.amazonaws.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="매장 안전사고현황 대시보드 / ㈜아성다이소 안전보건팀" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="㈜아성다이소 안전보건" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="매장 안전사고 현황 및 알람서비스" />
    <meta name="twitter:description" content="㈜아성다이소 · 안전보건팀 · 매장 안전사고 현황 및 예방 알람 서비스" />
    <meta name="twitter:image" content="https://daiso-safety-v1-frontend.s3.ap-northeast-2.amazonaws.com/og-image.png" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />

    <!-- Accoil Analytics SDK — VITE_ACCOIL_API_KEY 설정 시 활성화 -->
    <!-- 키 없으면 이 블록은 무해하게 무시됨 (빈 문자열 → 스크립트 미로드) -->
    <script>
      (function(k){if(!k)return;var s=document.createElement('script');s.async=true;
      s.src='https://cdn.accoil.com/accoil.js';s.onload=function(){window.accoil&&window.accoil.init(k);
      var q=window._sagoAnalyticsQueue||[];q.forEach(function(e){window.accoil.track(e.name,e.props);});
      window._sagoAnalyticsQueue=[];};document.head.appendChild(s);
      })('%VITE_ACCOIL_API_KEY%');
    </script>

    <!-- Kakao Maps SDK — 매장 위험지도(StoreRiskMap)용 -->
    <!-- appkey 는 .env 의 VITE_KAKAO_JS_KEY (JavaScript 키). autoload=false: 컴포넌트가 kakao.maps.load() 직접 호출 -->
    <link rel="preconnect" href="https://dapi.kakao.com" />
    <script defer
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_JS_KEY%&autoload=false&libraries=services"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
